[package]
name = "lu-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Tauri-independent module contracts and native tool registry for Lu"
license = "Apache-2.0"
publish = false

# Intentionally dependency-free at this stage. This is a separate Rust crate,
# not wired into Jan/Cowork until its boundaries have been reviewed.
[dependencies]
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
prost = "0.14"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"


[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
