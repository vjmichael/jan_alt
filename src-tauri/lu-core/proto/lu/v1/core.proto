syntax = "proto3";
package lu.v1;

// Internal Lu transport. External model APIs remain JSON-compatible.
message ToolCall {
  uint32 contract_version = 1;
  string call_id = 2;
  string tool_id = 3;
  optional string workspace_id = 4;
  string input_type_url = 5;
  bytes input = 6;
}

message ToolError {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

message ToolReply {
  string call_id = 1;
  string output_type_url = 2;
  oneof outcome {
    bytes output = 3;
    ToolError failure = 4;
  }
}

// Transitional typed wrapper for Jan's existing JSON-argument tools.
// New native Lu tools should define dedicated typed request/result messages.
message LegacyJsonArguments {
  string json = 1;
}

message LegacyImage {
  string name = 1;
  string data_url = 2;
}

message LegacyToolResult {
  string content = 1;
  optional string diff = 2;
  repeated LegacyImage images = 3;
}

// Lu's first actual bundled native tools (no MCP server or local command).
// Paths are relative to the user-authorized workspace root.
message ReadTextFileRequest {
  string path = 1;
  optional uint32 max_bytes = 2;
}
message ReadTextFileResult {
  string content = 1;
  uint64 bytes_read = 2;
  bool truncated = 3;
}
message ListDirectoryRequest {
  string path = 1;
  optional uint32 limit = 2;
}
message FileEntry {
  string name = 1;
  string kind = 2;
  uint64 size_bytes = 3;
}
message ListDirectoryResult {
  repeated FileEntry entries = 1;
  bool truncated = 2;
}

// CE worker IPC is native Protobuf, independent of legacy model-side JSON.
// Every envelope is still length-delimited by the host (u32 big-endian).
// Fields here carry data only, NEVER a permission token or host path.
message CeWorkerFrame {
  uint32 protocol_version = 1;
  oneof body {
    CeWorkerInvoke invoke = 2;
    CeWorkerRead read = 3;
    CeWorkerWrite write = 4;
    CeWorkerBrokerResult broker_result = 5;
    CeWorkerResult result = 6;
  }
}
message CeWorkerInvoke {
  string call_id = 1;
  string tool_id = 2;
  string input_type_url = 3;
  bytes input = 4;
}
message CeWorkerRead {
  uint64 request_id = 1;
  string tool_id = 2;
  string relative_path = 3;
}
message CeWorkerWrite {
  uint64 request_id = 1;
  string tool_id = 2;
  string relative_path = 3;
  bytes data = 4;
}
message CeWorkerBrokerResult {
  uint64 request_id = 1;
  bool ok = 2;
  bytes data = 3;
}
message CeWorkerResult {
  string output_type_url = 1;
  bytes output = 2;
}

// Host-supported signed Core Extension tool contracts. A tool descriptor must
// select exactly one of these effect/type pairs or a future host-vetted adapter.
// Arbitrary type URLs, JSON blobs, and unvalidated opaque tool bytes are denied.
message CeReadRequest {
  string relative_path = 1;
  uint32 max_bytes = 2;
}
message CeReadResult {
  bytes data = 1;
  uint64 bytes_read = 2;
  bool truncated = 3;
}
message CeWriteRequest {
  string relative_path = 1;
  bytes data = 2;
}
message CeWriteResult {
  uint64 bytes_written = 1;
  bool committed = 2;
}
message CeExecuteArgument {
  string name = 1;
  string value = 2;
}
message CeExecuteRequest {
  // Must equal the host-owned tool ID, never a shell command/path.
  string operation = 1;
  repeated CeExecuteArgument arguments = 2;
}
message CeExecuteResult {
  // Only "ok" or "failed"; no serialized exception or host handle.
  string status = 1;
  bytes output = 2;
}
