[package]
name = "lu-ipc-common"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
description = "Experimental headless Lu AF_UNIX transport and host-scoped admission; no worker execution"

[dependencies]
getrandom = "=0.3.4"
subtle = "=2.6.1"
zeroize = "=1.8.2"
prost = "=0.14.1"

[target.'cfg(windows)'.dependencies]
socket2 = "=0.6.5"

[build-dependencies]
prost-build = "=0.14.1"
protoc-bin-vendored = "=3.2.0"
