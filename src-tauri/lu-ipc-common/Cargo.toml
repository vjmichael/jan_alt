[package]
name = "lu-ipc-common"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
description = "Experimental Lu AF_UNIX host-authenticated transport with non-shipping process-tree containment"

[dependencies]
getrandom = "=0.3.4"
subtle = "=2.6.1"
zeroize = "=1.8.2"
prost = "=0.14.1"
sha2 = "=0.10.9"

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.30.1", features = ["signal", "process", "user"] }

[target.'cfg(windows)'.dependencies]
socket2 = "=0.6.5"
rustix = { version = "=1.1.5", features = ["net"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[build-dependencies]
prost-build = "=0.14.1"
protoc-bin-vendored = "=3.2.0"

[[bin]]
name = "lu-ipc-worker-fixture"
path = "src/bin/lu-ipc-worker-fixture.rs"
test = false
bench = false
