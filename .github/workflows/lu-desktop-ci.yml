    branches: ['lu/**']
    paths:
      - 'src-tauri/src/core/lu.rs'
      - 'src-tauri/src/core/lu_cowork_gate.rs'
      - 'src-tauri/src/core/lu_consent.rs'
      - 'src-tauri/src/core/lu_inference.rs'
      - 'src-tauri/src/core/app/**'
      - 'src-tauri/src/core/agent/global_config.rs'
      - 'src-tauri/src/core/agent/plugins.rs'
      - 'src-tauri/src/core/agent/subagent.rs'
      - 'src-tauri/src/core/mcp/oauth.rs'
      - 'src-tauri/src/core/mod.rs'
      - 'src-tauri/src/lib.rs'
      - 'src-tauri/plugins/tauri-plugin-agent-tools/**'
      - 'src-tauri/plugins/tauri-plugin-vector-db/**'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'web-app/src/lib/luNativeTools.ts'
      - 'web-app/src/lib/luInference.ts'
      - 'web-app/src/lib/version.ts'
      - 'web-app/src/lib/hydrateStores.ts'
      - 'web-app/src/lib/hydrateCoworkStores.ts'
      - 'web-app/src/lib/luDisabledSessionProgress.ts'
      - 'web-app/src/lib/luLegacyMessageMarkers.ts'
      - 'web-app/src/lib/__tests__/luDisabledSessionProgress.test.ts'
      - 'web-app/src/lib/__tests__/version.test.ts'
      - 'web-app/src/lib/__tests__/luInference.test.ts'
