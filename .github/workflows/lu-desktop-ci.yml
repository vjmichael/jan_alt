      - 'web-app/src/containers/dialogs/LuCeConsentDialog.tsx'
      - 'web-app/src/routes/__root.tsx'
      - 'web-app/src/lib/coworkTools.ts'
      - 'web-app/src/lib/coworkTransport.ts'
      - 'web-app/src/lib/coworkDispatch.ts'
      - 'web-app/src/lib/__tests__/cowork*.test.ts'
      - 'web-app/src/lib/__tests__/luNativeTools.test.ts'
      - 'web-app/src/lib/app-brand.ts'
      - 'web-app/src/lib/__tests__/app-brand.test.ts'
      - 'web-app/src/components/left-sidebar/**'
      - 'web-app/src/i18n/**'
      - 'web-app/src/types/global.d.ts'
      - 'web-app/vite.config.ts'
      - 'scripts/check-lu-cowork-route-graph.mjs'
      - 'scripts/check-lu-cowork-bundle-inventory.mjs'
      - 'scripts/check-lu-capability-surface.mjs'
      - 'src-tauri/capabilities/lu-default.json'
      - 'web-app/vitest.config.ts'
      - 'src-tauri/tauri.lu.conf.json'
      - 'scripts/prepare-lu-distribution.mjs'
      - 'src-tauri/src/core/setup.rs'
      - 'web-app/src/lib/custom-chat-transport.ts'
      - 'web-app/src/routes/threads/**'
      - '.github/workflows/lu-desktop-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lu-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Lu frontend TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: yarn install --immutable
      - name: Build Jan's linked plugin API packages
        run: yarn build:tauri:plugin:api
      - name: Build linked Jan core and extensions
        run: |
          yarn build:core
          yarn build:extensions
      - name: Test Lu desktop adapter and distribution identity
        run: |
          yarn workspace @janhq/web-app exec vitest run src/lib/__tests__/luNativeTools.test.ts src/lib/__tests__/luInference.test.ts src/lib/__tests__/custom-chat-transport-shell-switch.test.ts src/lib/__tests__/coworkTools.test.ts src/lib/__tests__/coworkDispatch.test.ts src/lib/__tests__/coworkTransport.test.ts src/lib/__tests__/app-brand.test.ts src/hooks/__tests__/useAppUpdater.test.ts src/components/left-sidebar/__tests__/headerLabel.test.tsx
      - name: Verify Jan and Lu Cowork route gates independently
        run: |
          yarn workspace @janhq/web-app exec vitest run src/lib/__tests__/version.test.ts src/components/left-sidebar/__tests__/coworkGate.test.tsx
          LU_BRAND=true yarn workspace @janhq/web-app exec vitest run src/lib/__tests__/version.test.ts src/components/left-sidebar/__tests__/coworkGate.test.tsx
          yarn workspace @janhq/web-app exec vitest run src/hooks/__tests__/useCoworkConfig.test.ts src/hooks/__tests__/useImageAttachmentConfig.test.ts
          yarn workspace @janhq/web-app exec vitest run src/lib/__tests__/luDisabledSessionProgress.test.ts src/components/__tests__/PromptProgress.test.tsx src/containers/dialogs/__tests__/LlamacppOomListener.test.tsx
      - name: Verify Lu-specific frontend build and splash identity
        run: |
          LU_BRAND=true IS_TAURI=true yarn build:web
          node scripts/check-lu-cowork-route-graph.mjs
          node scripts/check-lu-cowork-bundle-inventory.mjs
          grep -q '<title>Lu</title>' web-app/dist/index.html
          grep -q 'Booting up Lu' web-app/dist/index.html
          test -f web-app/dist/images/lu-logo.svg
      - name: Verify Lu main-window native command permissions
        run: node scripts/check-lu-capability-surface.mjs
      - name: Retain optimized Lu module inventory
        uses: actions/upload-artifact@v4
        with:
          name: lu-cowork-bundle-inventory
          path: web-app/.lu-bundle-modules.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Type-check Jan web application
        run: yarn workspace @janhq/web-app exec tsc -b --pretty false
      - name: Lint Lu desktop adapter
        run: yarn workspace @janhq/web-app exec eslint src/lib/luNativeTools.ts src/lib/luInference.ts src/containers/LuNativeModelPicker.tsx src/lib/coworkTools.ts src/lib/coworkTransport.ts src/lib/coworkDispatch.ts src/lib/custom-chat-transport.ts 'src/routes/threads/$threadId.tsx' src/containers/dialogs/LuCeConsentDialog.tsx

  rust-host:
    name: Lu Tauri host (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stub Tauri resource bundles for compile-only checks
        run: |
          node scripts/stub-tauri-resources.mjs
          node scripts/lu-ci-windows-icon.mjs
      # Includes the feature-gated Lu Protobuf supervisor and fail-closed
      # embedded engine-identity bootstrap; no Jan model-manager fallback.
      # Only the Lu primary webview is authorized to invoke these commands.
      - name: Validate Lu native inference Tauri formatting
        run: rustfmt --edition 2021 --check src-tauri/src/core/lu_inference.rs
      - name: Test Cowork IPC admission in Jan and Lu builds
        shell: pwsh
        run: |
          $binary = Join-Path $env:RUNNER_TEMP 'lu-cowork-gate.exe'
          rustc --edition=2021 --test src-tauri/src/core/lu_cowork_gate.rs -o $binary
          if ($LASTEXITCODE -ne 0) { throw 'Jan compatibility gate failed to compile' }
          & $binary
          if ($LASTEXITCODE -ne 0) { throw 'Jan compatibility gate failed' }
          rustc --edition=2021 --test --cfg 'feature="lu-distribution"' src-tauri/src/core/lu_cowork_gate.rs -o $binary
          if ($LASTEXITCODE -ne 0) { throw 'Lu alpha gate failed to compile' }
          & $binary
          if ($LASTEXITCODE -ne 0) { throw 'Lu alpha gate failed' }
      - name: Validate desktop feature compilation
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --features lu-distribution --lib
      - name: Verify Lu never selects Jan's profile
        run: |
          rustc --edition=2021 --test src-tauri/src/core/app/profile.rs -o "$env:RUNNER_TEMP\lu-profile-tests.exe"
          & "$env:RUNNER_TEMP\lu-profile-tests.exe" --test-threads=1
      - name: Compile desktop profile regression harness
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features lu-distribution --lib --no-run
      # The full Jan/Tauri GUI test executable is not runnable on a stock
      # Windows Actions runner (STATUS_ENTRYPOINT_NOT_FOUND from native DLLs).
      # Keep the desktop test *compile* gate above; execute consent provenance
      # tests in the Tauri-free lu-core suite on Linux instead.
