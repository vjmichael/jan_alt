name: Lu core Rust formatting recovery (one-shot)
# P2 inference streaming regression normalization.
# P3 native Protobuf inference framing and bridge rustfmt recovery.
# Normalize host-bound model identity and context-limit changes.
# P3 cancellation signal and host-session enforcement formatting.
# Final P3 constructor fixture normalization.
# P3 trusted desktop engine supervisor and Tauri host formatting.

on:
  push:
    branches:
      - lu/windows-native-tool-gate
    paths:
      - '.github/workflows/lu-core-format-recovery.yml'

permissions:
  contents: write

jobs:
  normalize-lu-core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - name: Format Lu-owned inference code and preserve all other content
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/lu-core/Cargo.toml
          rustfmt --edition 2021 src-tauri/src/core/lu_inference.rs
          git add -- \
            src-tauri/lu-core/src/gguf_preflight.rs \
            src-tauri/lu-core/src/model_admission.rs \
            src-tauri/lu-core/src/mmproj_admission.rs \
            src-tauri/lu-core/src/inference_host.rs \
            src-tauri/lu-core/src/inference_wire.rs \
            src-tauri/lu-core/src/inference_bridge.rs \
            src-tauri/lu-core/src/inference_supervisor.rs \
            src-tauri/lu-core/src/llama_cli_backend.rs \
            src-tauri/lu-core/src/persistent_llama_backend.rs \
            src-tauri/lu-core/src/lib.rs \
            src-tauri/src/core/lu_inference.rs \
            src-tauri/lu-core/examples/llama_cli_smoke.rs \
            src-tauri/lu-core/examples/persistent_llama_smoke.rs \
            src-tauri/lu-core/examples/persistent_llama_resilience_smoke.rs
          if git diff --cached --quiet; then
            echo 'Inference modules already formatted'
            exit 0
          fi
          original="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin refs/heads/lu/windows-native-tool-gate | cut -f1)"
          if [ "$original" != "$remote" ]; then
            echo 'Branch advanced; refuse formatting push to avoid overwriting new work'
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m 'style(lu): rustfmt P3 trusted inference supervisor and Tauri adapter'
          git push origin HEAD:refs/heads/lu/windows-native-tool-gate
