name: Lu 4F Windows task-owned CE worker termination

on:
  push:
    branches:
      - work/lu-phase4f-bound-durable-dispatch-20261029
    paths:
      - '.github/workflows/lu-phase4f-windows-worker.yml'
      - 'src-tauri/plugins/tauri-plugin-agent-tools/src/tools/ce_worker.rs'
      - 'src-tauri/plugins/tauri-plugin-agent-tools/tests/ce_worker_spawn.rs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-worker:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Run real process cancellation and descendant shutdown
        shell: pwsh
        run: cargo test --manifest-path src-tauri/plugins/tauri-plugin-agent-tools/Cargo.toml --test ce_worker_spawn -- --nocapture
