name: Lu Windows Installer (development preview)

on:
  push:
    branches:
      - lu/core-contracts-native-registry
    paths:
      - '.github/workflows/lu-windows-installer.yml'
  pull_request:
    paths:
      - '.github/workflows/lu-windows-installer.yml'
      - 'src-tauri/tauri.lu.conf.json'
      - 'scripts/prepare-lu-distribution.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lu-windows-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lu-installer:
    name: Build Lu NSIS installer (Windows x64, Vulkan)
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      JAN_ENGINE_VARIANT: vulkan
      JAN_ENGINE_REQUIRE_SIGNING: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout Lu development branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/plugins/tauri-plugin-llamacpp

      - name: Install Windows GNU make
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }

      - name: Install JS dependencies
        shell: pwsh
        run: |
          corepack enable
          yarn install --immutable

      - name: Build linked Jan/Tauri frontend dependencies
        shell: pwsh
        run: |
          yarn build:tauri:plugin:api
          yarn build:core
          yarn build:extensions

      - name: Download bundled Bun, UV and other binary dependencies
        shell: pwsh
        run: yarn download:bin

      - name: Prepare app icons and resources
        shell: pwsh
        run: |
          yarn build:icon
          yarn copy:assets:tauri

      - name: Install Vulkan engine build toolchain
        uses: ./.github/actions/setup-engine-toolchain
        with:
          variant: vulkan

      - name: Build pinned llama.cpp worker and backend libraries
        shell: bash
        run: |
          make build-engine

      - name: Check packaged worker and runtimes
        shell: pwsh
        run: |
          $bin = 'src-tauri/resources/bin'
          foreach ($name in @('jan-llama-worker.exe', 'bun-x86_64-pc-windows-msvc.exe', 'uv-x86_64-pc-windows-msvc.exe')) {
            if (-not (Test-Path (Join-Path $bin $name))) {
              throw "Missing required binary $name"
            }
          }
          $dlls = @(Get-ChildItem "$bin/*.dll" -ErrorAction SilentlyContinue)
          if ($dlls.Count -eq 0) { throw 'Missing llama.cpp runtime DLLs' }

      - name: Prepare unique Lu application identity and binary
        shell: pwsh
        run: node scripts/prepare-lu-distribution.mjs

      - name: Build independent Lu NSIS installer
        shell: pwsh
        run: yarn tauri build --features lu-distribution --bundles nsis --config src-tauri/tauri.lu.conf.json

      - name: Verify installers and record SHA-256
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction SilentlyContinue)
          if ($artifacts.Count -lt 1) { throw 'No Lu NSIS installer was produced' }
          foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash $artifact.FullName -Algorithm SHA256).Hash
            "$($artifact.Name) SHA256 $hash" | Tee-Object -FilePath lu-installer-sha256.txt -Append
          }
          Get-Content lu-installer-sha256.txt

      - name: Upload standalone Windows Lu installer
        uses: actions/upload-artifact@v4
        with:
          name: Lu-Windows-x64-Vulkan-Development-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            lu-installer-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload engine diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Lu-engine-build-diagnostics
          path: src-tauri/target/engine-build.log
          if-no-files-found: ignore
          retention-days: 7
