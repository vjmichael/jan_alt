name: Lu Windows Installer (development preview)

on:
  push:
    branches:
      - 'lu/windows-x64-preview-*'
      - 'lu/windows-native-tool-gate'
    paths:
      - '.github/workflows/lu-windows-installer.yml'
      - 'src-tauri/tauri.lu.conf.json'
      - 'src-tauri/plugins/tauri-plugin-llamacpp/src/engine/commands.rs'
      - 'scripts/check-lu-windows-startup.ps1'
      - 'scripts/smoke-lu-windows-x64.ps1'
      - 'scripts/check-lu-windows-engine-worker.ps1'
      - 'scripts/prepare-lu-distribution.mjs'
      - 'scripts/package-lu-inference-engine.ps1'
      - 'src-tauri/src/core/lu_inference.rs'
      - 'src-tauri/lu-core/src/inference_supervisor.rs'
      - 'web-app/src/lib/luInference.ts'
      - 'web-app/src/lib/custom-chat-transport.ts'
      - 'web-app/src/containers/LuNativeModelPicker.tsx'
      - 'web-app/src/routes/threads/**'
  pull_request:
    paths:
      - '.github/workflows/lu-windows-installer.yml'
      - 'src-tauri/tauri.lu.conf.json'
      - 'src-tauri/plugins/tauri-plugin-llamacpp/src/engine/commands.rs'
      - 'scripts/check-lu-windows-startup.ps1'
      - 'scripts/smoke-lu-windows-x64.ps1'
      - 'scripts/check-lu-windows-engine-worker.ps1'
      - 'scripts/prepare-lu-distribution.mjs'
      - 'scripts/package-lu-inference-engine.ps1'
      - 'src-tauri/src/core/lu_inference.rs'
      - 'src-tauri/lu-core/src/inference_supervisor.rs'
      - 'web-app/src/lib/luInference.ts'
      - 'web-app/src/lib/custom-chat-transport.ts'
      - 'web-app/src/containers/LuNativeModelPicker.tsx'
      - 'web-app/src/routes/threads/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lu-windows-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lu-installer:
    name: Build Lu NSIS installer (Windows x86-64, Vulkan)
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      JAN_ENGINE_VARIANT: vulkan
      JAN_ENGINE_REQUIRE_SIGNING: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout Lu development branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Validate Windows x86-64 Rust host and Lu app identity
        shell: pwsh
        run: |
          $hostTriple = (rustc -vV | Select-String '^host: ').ToString().Replace('host: ', '').Trim()
          if ($hostTriple -ne 'x86_64-pc-windows-msvc') {
            throw "Unexpected Rust host '$hostTriple'; x86-64 Windows MSVC is required"
          }
          node --check scripts/prepare-lu-distribution.mjs
          node -e "const c=require('./src-tauri/tauri.lu.conf.json'); if(c.identifier!=='ai.lu.preview'||c.productName!=='Lu'||c.mainBinaryName!=='Lu-Desktop'||c.bundle.targets.join(',')!=='nsis'||c.plugins.updater.endpoints.length)process.exit(1)"
          "Lu preview x86-64 host confirmed: $hostTriple"

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/plugins/tauri-plugin-llamacpp

      - name: Regression-test Lu installed worker resource lookup
        shell: pwsh
        run: |
          cargo test --locked --manifest-path src-tauri/plugins/tauri-plugin-llamacpp/Cargo.toml --lib lu_mapped_bin_worker_is_found_before_legacy_layout
          if ($LASTEXITCODE -ne 0) { throw 'Lu mapped worker location regression failed' }

      - name: Install Windows GNU make
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }

      - name: Install JS dependencies
        shell: pwsh
        run: |
          corepack enable
          yarn install --immutable

      - name: Build linked Jan/Tauri frontend dependencies
        shell: pwsh
        run: |
          yarn build:tauri:plugin:api
          yarn build:core
          yarn build:extensions

      - name: Download bundled Bun, UV and other binary dependencies
        shell: pwsh
        run: yarn download:bin

      - name: Prepare app icons and resources
        shell: pwsh
        run: |
          yarn build:icon
          yarn copy:assets:tauri

      - name: Install Vulkan engine build toolchain
        uses: ./.github/actions/setup-engine-toolchain
        with:
          variant: vulkan

      - name: Build pinned llama.cpp worker and backend libraries
        shell: bash
        run: |
          make build-engine

      - name: Check packaged worker and runtimes
        shell: pwsh
        run: |
          $bin = 'src-tauri/resources/bin'
          foreach ($name in @('jan-llama-worker.exe', 'bun-x86_64-pc-windows-msvc.exe', 'uv-x86_64-pc-windows-msvc.exe')) {
            if (-not (Test-Path (Join-Path $bin $name))) {
              throw "Missing required binary $name"
            }
          }
          $dlls = @(Get-ChildItem "$bin/*.dll" -ErrorAction SilentlyContinue)
          if ($dlls.Count -eq 0) { throw 'Missing llama.cpp runtime DLLs' }

      - name: Build and seal Lu-owned persistent CPU inference package
        shell: pwsh
        run: |
          ./scripts/package-lu-inference-engine.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Lu native CPU engine packaging failed' }

      - name: Verify trusted native inference package is build-pinned
        shell: pwsh
        run: |
          if (!$env:LU_TRUSTED_LLAMA_SERVER_SHA256 -or !$env:LU_TRUSTED_LLAMA_PACKAGE_SHA256) {
            throw 'Lu inference binary and package manifest digests not embedded'
          }
          $dir = 'src-tauri/resources/lu-inference'
          foreach ($name in @('llama-server.exe', 'manifest.json')) {
            if (!(Test-Path -LiteralPath (Join-Path $dir $name))) { throw "Missing native Lu package artifact: $name" }
          }
          $manifest = Get-Content -LiteralPath (Join-Path $dir 'manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.upstreamCommit -cne '7fe450e19305b828c199d602c23a8337aaa1f03b') {
            throw 'Lu engine commit is not the independently pinned source'
          }
          $hash = (Get-FileHash -LiteralPath (Join-Path $dir 'manifest.json') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -cne $env:LU_TRUSTED_LLAMA_PACKAGE_SHA256) { throw 'Lu engine package manifest hash changed' }

      - name: Prepare unique Lu application identity and binary
        shell: pwsh
        run: node scripts/prepare-lu-distribution.mjs

      - name: Build independent Lu NSIS installer for Windows x86-64
        shell: pwsh
        run: yarn tauri build --target x86_64-pc-windows-msvc --features lu-distribution --bundles nsis --config src-tauri/tauri.lu.conf.json

      - name: Verify installers and record SHA-256
        shell: pwsh
        run: |
          $folder = 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
          $artifacts = @(Get-ChildItem "$folder/*.exe" -ErrorAction SilentlyContinue)
          if ($artifacts.Count -ne 1) { throw "Expected exactly one Windows x64 Lu NSIS installer; found $($artifacts.Count)" }
          $artifact = $artifacts[0]
          $hash = (Get-FileHash $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($artifact.Name)" | Set-Content -Path lu-installer-sha256.txt -Encoding utf8
          @{
            application = 'Lu'
            identity = 'ai.lu.preview'
            architecture = 'x86_64-pc-windows-msvc'
            installerType = 'nsis'
            engineVariant = 'vulkan'
            luNativeInference = 'cpu-llama-server'
            luEngineSha256 = $env:LU_TRUSTED_LLAMA_SERVER_SHA256
            luPackageManifestSha256 = $env:LU_TRUSTED_LLAMA_PACKAGE_SHA256
            signedInstaller = $false
            gitCommit = $env:GITHUB_SHA
            gitRef = $env:GITHUB_REF
            installerFile = $artifact.Name
            installerSha256 = $hash
          } | ConvertTo-Json | Set-Content -Path lu-windows-x64-build.json -Encoding utf8
          Get-Content lu-installer-sha256.txt
          Get-Content lu-windows-x64-build.json

      - name: Download checksum-pinned small GGUF for packaged inference smoke
        shell: pwsh
        run: |
          $model = Join-Path $env:RUNNER_TEMP 'SmolLM2-135M-Instruct-Q4_K_M.gguf'
          $url = 'https://huggingface.co/lmstudio-community/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q4_K_M.gguf'
          & curl.exe --fail --location --retry 2 --max-time 300 --output $model $url
          if ($LASTEXITCODE -ne 0) { throw 'Unable to obtain pinned real GGUF smoke model' }
          $expected = 'bda484992f9655d22504b14e57985257fa6a86937c61f957cf99c10a3bcae169'
          $actual = (Get-FileHash -LiteralPath $model -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) { throw 'Downloaded GGUF checksum differs from pinned test reference' }
          "LU_REAL_GGUF_SMOKE_MODEL=$model" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'Pinned small real GGUF verified for installed Lu worker inference smoke.'

      - name: Smoke-test isolated Lu x64 NSIS installation and removal
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'lu-nsis-smoke-artifact'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe' $staging
          Copy-Item 'lu-windows-x64-build.json' $staging
          ./scripts/smoke-lu-windows-x64.ps1 -ArtifactDir $staging -ExpectedCommit $env:GITHUB_SHA -ProbeStartup -RequireNativeMcpFirstRun -ProbeWorker -RealGgufPath $env:LU_REAL_GGUF_SMOKE_MODEL

      - name: Upload standalone Windows Lu installer
        uses: actions/upload-artifact@v4
        with:
          name: Lu-Windows-x64-Vulkan-Development-Installer
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            lu-installer-sha256.txt
            lu-windows-x64-build.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload engine diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Lu-engine-build-diagnostics
          path: src-tauri/target/engine-build.log
          if-no-files-found: ignore
          retention-days: 7
