name: Lu Linux core one-shot verification
# Verifies source produced locally; not Lu's primary development environment.
# Third run: diagnose why Cargo wants to canonicalize the derived standalone lock.
on:
  push:
    branches:
      - verify/lu-linux-core-20261030
    paths:
      - .github/workflows/lu-linux-core-one-shot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lu-linux-one-shot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-core:
    name: Linux core / pinned dependency verification
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - name: Identify source and compiler
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          rustc --version
          cargo --version
      - name: Linux packaging and offline preparation tests
        run: |
          node --version
          node --test scripts/tests/*.test.mjs
          node scripts/prepare-lu-linux.mjs --check
      - name: Derive Cargo lock strictly from the tracked Lu parent
        if: success() || failure()
        run: |
          node scripts/prepare-lu-core-lock.mjs --check
          node scripts/prepare-lu-core-lock.mjs --write
      - name: Resolve Cargo's canonical standalone dependency lock
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          cp src-tauri/lu-core/Cargo.lock /tmp/lu-derived-Cargo.lock
          cargo metadata --manifest-path src-tauri/lu-core/Cargo.toml --format-version 1 --no-deps >/dev/null
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          def pkgs(path):
              with open(path, 'rb') as fp:
                  return {(p['name'], p['version']): p.get('checksum', '') for p in tomllib.load(fp)['package']}
          derived = pkgs('/tmp/lu-derived-Cargo.lock')
          canonical = pkgs('src-tauri/lu-core/Cargo.lock')
          parent = pkgs('src-tauri/Cargo.lock')
          print('LU_LOCK_DIAG derived=', len(derived), 'canonical=', len(canonical), 'parent=', len(parent))
          print('LU_LOCK_DIAG removed_from_canonical=', sorted(set(derived) - set(canonical))[:50])
          additions = sorted(set(canonical) - set(derived))
          print('LU_LOCK_DIAG new_to_canonical=', additions[:50])
          drift = [(name, vers) for (name, vers), checksum in canonical.items()
                   if (name, vers) not in parent or parent[(name, vers)] != checksum]
          print('LU_LOCK_DIAG unpinned_parent_versions=', sorted(drift)[:50])
          if drift:
              raise SystemExit('Canonical Lu lock diverges from tracked parent dependency pins')
          PY
      - name: Compile and test actual Lu Rust core
        if: success() || failure()
        run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --all-targets
      - name: Check Rust source formatting
        if: success() || failure()
        run: cargo fmt --manifest-path src-tauri/lu-core/Cargo.toml -- --check
      - name: Strict Lu Rust core Clippy
        if: success() || failure()
        run: cargo clippy --locked --manifest-path src-tauri/lu-core/Cargo.toml --all-targets -- -D warnings
