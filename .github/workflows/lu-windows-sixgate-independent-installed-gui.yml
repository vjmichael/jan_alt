name: Lu Windows independent same-binary installed GUI tool and cold restore
on:
  push:
    branches:
      - 'lu/windows-alpha-six-gates-20261031'
    paths:
      - '.github/workflows/lu-windows-sixgate-independent-installed-gui.yml'
      - 'scripts/lu/run-installed-lu-gui-tool.ps1'
      - 'scripts/lu/run-installed-lu-uia-full.ps1'
      - 'scripts/lu/diagnose-installed-first-turn.mjs'
      - 'scripts/lu/diagnose-installed-first-turn.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  unchanged-installed-nsis-gui:
    name: Actual installed NSIS GUI model/tool + rendered restart (independent harness)
    runs-on: windows-2025
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify current independent GUI evidence tests and UIA script syntax
        shell: pwsh
        run: |
          node --test scripts/lu/check-installed-gui-cold-restore.test.mjs scripts/lu/verify-installed-lu-gui-tool.test.mjs scripts/lu/verify-installed-lu-uia-evidence.test.mjs scripts/lu/diagnose-installed-first-turn.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Independent installed GUI evidence regression failed' }
          node scripts/lu/check-installed-gui-cold-restore.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Cold GUI visual restoration source contract missing' }
          # The previous built artifact was valid, but this external launcher
          # contained a truncated SHA check and duplicate sections. Never
          # reach an install until both PowerShell entrypoints parse cleanly.
          foreach ($source in @(
            'scripts/lu/run-installed-lu-gui-tool.ps1',
            'scripts/lu/run-installed-lu-uia-full.ps1'
          )) {
            $launcherTokens=$null
            $launcherErrors=$null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $source).ProviderPath,
              [ref]$launcherTokens,[ref]$launcherErrors) | Out-Null
            if ($launcherErrors.Count -gt 0) { throw "Windows PowerShell launcher syntax is invalid: $source" }
          }
          $launcher = Get-Content 'scripts/lu/run-installed-lu-gui-tool.ps1' -Raw
          if (($launcher.Split(@('LU_INSTALLED_GUI_NATIVE_ONLY_UNINSTALL_PASS'), [StringSplitOptions]::None).Count - 1) -ne 1) {
            throw 'Lu installed GUI launcher contains duplicated teardown sections'
          }
          Write-Host 'LU_WIN6_GUI_LAUNCHER_SOURCE_PASS syntax=true unique_teardown=true'
          $uia = Get-Content 'scripts/lu/run-installed-lu-uia-full.ps1' -Raw
          foreach ($needle in @(
            'Probe-LuDiagnosticByVisibleButton',
            'LU_INSTALLED_UIA_FIRST_TURN_DIAGNOSTIC',
            'LU_INSTALLED_UIA_COLD_GUI_RENDER_PASS',
            'LU_INSTALLED_UIA_NORMAL_EXIT_PASS'
          )) {
            if (!$uia.Contains($needle)) { throw "Lu UIA diagnostic or acceptance witness missing: $needle" }
          }
          Write-Host 'LU_WIN6_HOST_DIAGNOSTIC_SOURCE_PASS user_visible_probe=true redacted=true'
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/lu/run-installed-lu-uia-full.ps1').ProviderPath,
            [ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw 'Installed GUI UIA script not valid Windows PowerShell' }
      - name: Fetch ONLY the immutable corrected-source native-only NSIS candidate
        uses: actions/download-artifact@v4
        with:
          name: Lu-Windows-x64-NativeOnly-CPU-Installer
          repository: ${{ github.repository }}
          run-id: 41255104860
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/lu-win6-source-nsis
      - name: Verify builder provenance and exact immutable installer bytes
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'lu-win6-source-nsis'
          $metadata = Join-Path $root 'lu-windows-x64-build.json'
          if (!(Test-Path -LiteralPath $metadata -PathType Leaf)) {
            throw 'No complete corrected-source NSIS artifact; no installed GUI test possible'
          }
          $m = Get-Content -LiteralPath $metadata -Raw | ConvertFrom-Json
          $source = '8ab711865f47c79e3f2e02ac92bed1b6cd331a33'
          if ($m.gitCommit -cne $source -or
              $m.identity -cne 'ai.lu.preview' -or
              $m.architecture -cne 'x86_64-pc-windows-msvc' -or
              $m.distributionMode -cne 'native-only' -or
              $m.legacyRuntimeBundled -ne $false -or
              $m.luNativeInference -cne 'cpu-llama-server' -or
              $m.installerSha256 -cne 'f9a41d1a2aaca7f18b06c726030d080b345719f51ea1646e463332ad6138d1af') {
            throw 'The installed GUI acceptance artifact is not the corrected native-only Lu build'
          }
          $all = @(Get-ChildItem -LiteralPath $root -Recurse -File -Filter '*.exe')
          if ($all.Count -ne 1 -or $all[0].Name -cne $m.installerFile -or
              (Get-FileHash -LiteralPath $all[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $m.installerSha256) {
            throw 'Lu independent GUI test refuses missing/repacked NSIS bytes'
          }
          "LU_SIXGATE_PINNED_NSIS_SHA=$($m.installerSha256)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'LU_SIXGATE_INDEPENDENT_PIN_PASS source_match=true nsis_hash=true installed_test=pending'
      - name: Download and verify Qwen2.5 real GGUF in disposable runner
        shell: pwsh
        run: |
          $model = Join-Path $env:RUNNER_TEMP 'qwen2.5-0.5b-instruct-q4_k_m.gguf'
          $source = 'https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf'
          & curl.exe --fail --location --retry 2 --max-time 300 --output $model $source
          if ($LASTEXITCODE -ne 0) { throw 'Real pinned GGUF unavailable' }
          $sha = '74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db'
          if ((Get-FileHash -LiteralPath $model -Algorithm SHA256).Hash.ToLowerInvariant() -cne $sha) {
            throw 'Real Qwen GGUF SHA-256 changed'
          }
          "LU_SIXGATE_GGUF_PATH=$model" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run unchanged installed GUI tool, SQLite journal and visible cold-process restoration
        shell: pwsh
        run: |
          ./scripts/lu/run-installed-lu-gui-tool.ps1 `
            -ArtifactDir (Join-Path $env:RUNNER_TEMP 'lu-win6-source-nsis') `
            -ModelPath $env:LU_SIXGATE_GGUF_PATH `
            -ExpectedCommit '8ab711865f47c79e3f2e02ac92bed1b6cd331a33' `
            -ExpectedInstallerSha256 $env:LU_SIXGATE_PINNED_NSIS_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Installed Lu GUI, model tool, or visible restart acceptance failed' }
          Write-Host 'LU_WIN6_INDEPENDENT_INSTALLED_GUI_RESTART_PASS model=real native_tool=actual persisted_render=true'
      # Never upload disposable model, profile, raw assistant text or audit databases.
