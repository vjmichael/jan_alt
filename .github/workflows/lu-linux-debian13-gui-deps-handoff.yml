name: Lu Linux Debian 13 GUI dependencies handoff
# One-shot package transport for offline LOCAL Lu desktop builds. Not CI development.
on:
  push:
    branches:
      - verify/lu-linux-core-20261030
    paths:
      - .github/workflows/lu-linux-debian13-gui-deps-handoff.yml

permissions:
  contents: read

jobs:
  download-debian13-amd64:
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 35
    steps:
      - name: Download Debian Trixie amd64 GUI development dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(dpkg --print-architecture)" = amd64
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends dpkg-dev ca-certificates
          mkdir -p /tmp/offline-apt-cache/partial /tmp/lu-gui-bundle/pool
          apt-get \
            -o Dir::Cache::archives=/tmp/offline-apt-cache/ \
            -y --download-only --no-install-recommends install \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential
          find /tmp/offline-apt-cache -maxdepth 1 -name '*.deb' -type f \
            -exec cp -- '{}' /tmp/lu-gui-bundle/pool/ \;
          count="$(find /tmp/lu-gui-bundle/pool -maxdepth 1 -name '*.deb' | wc -l)"
          if [ "$count" -lt 10 ]; then
            echo "Insufficient packages downloaded: $count" >&2
            exit 3
          fi
          cd /tmp/lu-gui-bundle
          dpkg-scanpackages pool /dev/null > Packages
          gzip -n -k Packages
          (
            cd pool
            sha256sum ./*.deb > ../SHA256SUMS
          )
          cat > README.txt <<'EOF'
          Lu Debian 13 (Trixie) amd64 GUI dependencies, transport only.
          Generated by an isolated official Debian trixie GitHub Actions container.
          Packages were downloaded by APT after repository signature verification.
          SHA256SUMS checks individual .deb files. This is not a Lu installer.
          Unpack to a local temporary directory; verify pool .deb checksums.
          These files are for Debian 13 amd64 only; do NOT install on Windows.
          The local Lu build agent will use this package pool as an offline APT repository.
          EOF
          du -sh pool
          echo "LU_DEBIAN13_GUI_DEPS_DOWNLOADED count=$count arch=amd64"
          mkdir -p /tmp/artifact
          tar -czf /tmp/artifact/Lu-Debian13-AMD64-GUI-Dependencies.tar.gz \
            -C /tmp/lu-gui-bundle README.txt Packages Packages.gz SHA256SUMS pool
          sha256sum /tmp/artifact/Lu-Debian13-AMD64-GUI-Dependencies.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: lu-debian13-amd64-gui-deps-shortlived
          path: /tmp/artifact/Lu-Debian13-AMD64-GUI-Dependencies.tar.gz
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
