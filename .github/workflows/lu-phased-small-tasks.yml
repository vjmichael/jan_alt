name: Lu phased small engineering tasks

on:
  push:
    branches:
      - 'work/lu-phase*'
    paths:
      - '.github/workflows/lu-phased-small-tasks.yml'
      - 'src-tauri/lu-core/src/inference_supervisor.rs'
      - 'src-tauri/lu-core/src/registry.rs'
      - 'src-tauri/lu-core/tests/native_dispatch_error_codes.rs'
      - 'src-tauri/lu-core/src/cross_chat_reference.rs'
      - 'src-tauri/lu-core/tests/cross_chat_reference.rs'
      - 'src-tauri/lu-core/src/lib.rs'
      - 'src-tauri/lu-core/Cargo.toml'
      - 'src-tauri/lu-core/src/benchmark_contract.rs'
      - 'src-tauri/lu-core/src/export_contract.rs'
      - 'src-tauri/lu-core/tests/benchmark_contract.rs'
      - 'src-tauri/lu-core/tests/export_contract.rs'
      - 'docs/lu/independent-small-engineering-backlog.md'
      - 'docs/lu/independent-engineering-phases.md'
  pull_request:
    paths:
      - '.github/workflows/lu-phased-small-tasks.yml'
      - 'src-tauri/lu-core/src/inference_supervisor.rs'
      - 'src-tauri/lu-core/src/registry.rs'
      - 'src-tauri/lu-core/tests/native_dispatch_error_codes.rs'
      - 'src-tauri/lu-core/src/cross_chat_reference.rs'
      - 'src-tauri/lu-core/tests/cross_chat_reference.rs'
      - 'src-tauri/lu-core/src/lib.rs'
      - 'src-tauri/lu-core/Cargo.toml'
      - 'src-tauri/lu-core/src/benchmark_contract.rs'
      - 'src-tauri/lu-core/src/export_contract.rs'
      - 'src-tauri/lu-core/tests/benchmark_contract.rs'
      - 'src-tauri/lu-core/tests/export_contract.rs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lu-phased-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase1-reliability:
    name: Phase 1 - cancellation and typed native errors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/lu-core
      - name: Verify repeat cancellation, wrong-session and finished-turn denial
        run: cargo test --manifest-path src-tauri/lu-core/Cargo.toml --lib inference_supervisor::tests::authorized_model_and_cancellation_without_deadlock
      - name: Verify stable typed dispatch errors never expose details
        run: cargo test --manifest-path src-tauri/lu-core/Cargo.toml --test native_dispatch_error_codes
      - name: Verify existing native registry and lifecycle behavior
        run: cargo test --manifest-path src-tauri/lu-core/Cargo.toml --test registry_contracts

  phase2-linked-context:
    name: Phase 2 - data-only cross-chat references
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/lu-core
      - name: Test cross-chat host access, data-only trust and bounded context
        run: cargo test --manifest-path src-tauri/lu-core/Cargo.toml --test cross_chat_reference
      - name: Verify immutable ANSF revisions remain scoped to a conversation
        run: cargo test --manifest-path src-tauri/lu-core/Cargo.toml --test ansf_revisions
      - name: Verify native tool authority cannot be minted by linked text
        run: cargo test --manifest-path src-tauri/lu-core/Cargo.toml --test conversation_authority

  phase3-schema-contracts:
    name: Phase 3 - benchmark and artifact export contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/lu-core
      - name: Benchmark tier pairing, matched quantization and failure attribution
        run: cargo test --manifest-path src-tauri/lu-core/Cargo.toml --test benchmark_contract
      - name: Safe file-export naming and provenance for PDF DOCX CSV
        run: cargo test --manifest-path src-tauri/lu-core/Cargo.toml --test export_contract
