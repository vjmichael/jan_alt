name: Lu Linux branded frontend and Debian preview
on:
  push:
    branches: ['lu/linux-ui-deb-candidate-20261030']
    paths: ['.github/workflows/lu-linux-ui-deb.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lu-linux-ui-deb-candidate
  cancel-in-progress: true

jobs:
  ui-deb:
    name: Build real Lu frontend and Linux developer .deb
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v4
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use pinned Yarn 4.5.3
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
      - name: Install JavaScript dependencies
        run: yarn install --immutable
      - name: Build linked Tauri plugin APIs
        run: yarn build:tauri:plugin:api
      - name: Build core and extensions
        run: |
          yarn build:core
          yarn build:extensions
      - name: Build real Lu-branded frontend
        env:
          LU_BRAND: 'true'
          IS_TAURI: 'true'
        run: |
          yarn build:web
          grep -q '<title>Lu</title>' web-app/dist/index.html
          grep -q 'Booting up Lu' web-app/dist/index.html
          test -f web-app/dist/images/lu-logo.svg
          test "$(find web-app/dist/assets -maxdepth 1 -name '*.js' | wc -l)" -gt 0
          echo 'Actual Lu frontend built from source: no placeholder HTML.' >> "$GITHUB_STEP_SUMMARY"
      - name: Rust 1.98
        uses: dtolnay/rust-toolchain@1.98.0
      - name: Linux native build packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libglib2.0-dev libatk1.0-dev libpango1.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev librsvg2-bin libayatana-appindicator3-dev file patchelf dpkg-dev
          pkg-config --modversion webkit2gtk-4.1 gtk+-3.0 libsoup-3.0
      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Generate Lu-only Linux icons
        run: |
          set -euo pipefail
          test -f src-tauri/icons/lu-icon.svg
          mkdir -p src-tauri/icons/lu
          rsvg-convert -w 32 -h 32 -o src-tauri/icons/lu/32x32.png src-tauri/icons/lu-icon.svg
          rsvg-convert -w 128 -h 128 -o src-tauri/icons/lu/128x128.png src-tauri/icons/lu-icon.svg
          rsvg-convert -w 256 -h 256 -o src-tauri/icons/lu/128x128@2x.png src-tauri/icons/lu-icon.svg
          file src-tauri/icons/lu/*.png
      - name: Prepare Lu identity and genuine-resource-only developer bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          manifest = Path('src-tauri/Cargo.toml')
          data = manifest.read_text()
          for old, new in (
              ('default-run = "Jan-Desktop"', 'default-run = "Lu-Desktop"'),
              ('name = "Jan-Desktop"', 'name = "Lu-Desktop"'),
          ):
              if data.count(old) != 1:
                  raise SystemExit('Unexpected Cargo binary identity: ' + old)
              data = data.replace(old, new, 1)
          manifest.write_text(data)
          path = Path('src-tauri/tauri.lu.linux.conf.json')
          conf = json.loads(path.read_text())
          if (conf.get('productName'), conf.get('mainBinaryName'), conf.get('identifier')) != ('Lu', 'Lu-Desktop', 'ai.lu.preview'):
              raise SystemExit('Lu Linux identity mismatch')
          bundle = conf.setdefault('bundle', {})
          bundle['targets'] = ['deb']
          bundle['createUpdaterArtifacts'] = False
          bundle['publisher'] = 'Lu Development Preview'
          bundle['icon'] = [
              'icons/lu/32x32.png',
              'icons/lu/128x128.png',
              'icons/lu/128x128@2x.png'
          ]
          bundle['resources'] = {
              'resources/LICENSE': 'LICENSE',
              'resources/NOTICE': 'NOTICE',
              'resources/licenses/Apache-2.0.txt': 'licenses/Apache-2.0.txt',
          }
          for source in bundle['resources']:
              if not Path('src-tauri', source).is_file():
                  raise SystemExit('Missing license resource: ' + source)
          bundle['externalBin'] = []
          bundle.setdefault('linux', {}).setdefault('deb', {})['files'] = {}
          conf.setdefault('plugins', {}).setdefault('updater', {})['endpoints'] = []
          conf.setdefault('build', {})['beforeBuildCommand'] = ''
          path.write_text(json.dumps(conf, indent=2) + chr(10))
          print('Lu developer preview: no fake llama-server, worker, uv or bun binaries.')
          PY
      - name: Build Lu binary and Debian shell preview
        run: yarn tauri build --config src-tauri/tauri.lu.linux.conf.json --features lu-distribution --bundles deb
      - name: Inspect Debian package and linked dependencies
        run: |
          set -euo pipefail
          count=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -type f | wc -l)
          test "$count" -eq 1
          deb=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -type f | head -n 1)
          dpkg-deb -I "$deb" | tee /tmp/lu-deb-control.txt
          dpkg-deb -c "$deb" | tee /tmp/lu-deb-files.txt
          mkdir -p /tmp/lu-extracted
          dpkg-deb -x "$deb" /tmp/lu-extracted
          test -x /tmp/lu-extracted/usr/bin/Lu-Desktop
          file /tmp/lu-extracted/usr/bin/Lu-Desktop
          ldd /tmp/lu-extracted/usr/bin/Lu-Desktop | tee /tmp/lu-deb-ldd.txt
          if grep -q 'not found' /tmp/lu-deb-ldd.txt; then
            echo 'Unresolved shared libraries in packaged binary' >&2
            exit 1
          fi
          echo 'Developer shell .deb verified. Engine/inference functionality NOT included.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Lu shell-only developer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lu-linux-ui-shell-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
          retention-days: 14
