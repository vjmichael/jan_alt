name: Lu 4F rustfmt repair
on:
  push:
    branches:
      - work/lu-phase4f-bound-durable-dispatch-20261029
    paths:
      - '.github/workflows/lu-phase4f-rustfmt-repair.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - name: Format Lu core only and commit if changed
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/lu-core/Cargo.toml --all
          git add src-tauri/lu-core
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(lu): apply rustfmt for phase 4F core tests"
            git push origin HEAD:work/lu-phase4f-bound-durable-dispatch-20261029
          fi
