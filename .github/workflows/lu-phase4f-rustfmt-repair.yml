name: Lu 4F rustfmt repair
on:
  push:
    branches:
      - work/lu-phase4f-bound-durable-dispatch-20261029
    paths:
      - '.github/workflows/lu-phase4f-rustfmt-repair.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - name: Generate formatted Lu core patch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/lu-core/Cargo.toml --all
          git diff -- src-tauri/lu-core > lu-4f-rustfmt.patch
          test -s lu-4f-rustfmt.patch
      - uses: actions/upload-artifact@v4
        with:
          name: lu-4f-rustfmt-patch
          path: lu-4f-rustfmt.patch
          retention-days: 7
