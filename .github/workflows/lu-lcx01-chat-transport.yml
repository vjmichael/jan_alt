name: Lu LCX-01 independent chat transport
on:
  push:
    branches:
      - 'work/lu-core-owned-next-stable-20261031'
    paths:
      - 'web-app/src/lib/luChatTransport.ts'
      - 'web-app/src/lib/__tests__/luChatTransport.test.ts'
      - 'scripts/lu/check-lcx01-lu-chat-transport.mjs'
      - '.github/workflows/lu-lcx01-chat-transport.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-only-transport-tests:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce Lu chat/Jan runtime graph separation at source
        shell: pwsh
        run: |
          node scripts/lu/check-lcx01-lu-chat-transport.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Lu chat transport source authority check failed' }
      - name: Install pinned frontend packages
        shell: pwsh
        run: |
          corepack enable
          yarn install --immutable
          if ($LASTEXITCODE -ne 0) { throw 'Frontend install failed' }
      - name: Build linked Tauri APIs, core and extension packages
        shell: pwsh
        run: |
          yarn build:tauri:plugin:api
          if ($LASTEXITCODE -ne 0) { throw 'Native frontend plugin API build failed' }
          yarn build:core
          if ($LASTEXITCODE -ne 0) { throw 'Native frontend core package build failed' }
          yarn build:extensions
          if ($LASTEXITCODE -ne 0) { throw 'Native frontend extension package build failed' }
      - name: Verify independent transport mutations and host adapter mocks
        shell: pwsh
        run: |
          yarn workspace @janhq/web-app exec vitest run src/lib/__tests__/luChatTransport.test.ts src/lib/__tests__/luInference.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Native Lu chat transport tests failed' }
          Write-Host 'LU_LCX01_CHAT_TRANSPORT_TEST_PASS linked_to_real_route=false'
      - name: Compile Lu-branded UI bundle
        shell: pwsh
        env:
          LU_BRAND: 'true'
          IS_TAURI: 'true'
        run: |
          yarn build:web
          if ($LASTEXITCODE -ne 0) { throw 'Lu-branded frontend build failed' }
          Write-Host 'LU_LCX01_BRANDED_FRONTEND_BUILD_PASS installed_GUI=not_tested'
