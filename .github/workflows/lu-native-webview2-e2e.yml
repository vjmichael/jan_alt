name: Lu native WebView2 persistent GGUF acceptance

on:
  push:
    branches:
      - lu/windows-native-tool-gate
      - lu/desktop-native-tool-loop
      - work/lu-phase4-webview2-bootstrap-20261028
      - work/lu-phase4e-runtime-package-recovery-20261028
      - work/lu-phase4h-windows-acceptance-recovery-20261029
      - work/lu-alpha01-diagnostics-priority-20261029
    paths:
      - '.github/workflows/lu-native-webview2-e2e.yml'
      - 'scripts/stage-lu-webview2-sealed-engine.ps1'
      - 'e2e/specs/lu-native-inference.e2e.ts'
      - 'e2e/wdio.conf.ts'
      - 'web-app/src/lib/luInference.ts'
      - 'web-app/src/hooks/useMessages.ts'
      - 'web-app/src/hooks/__tests__/useMessages.test.ts'
      - 'web-app/src/routes/threads/**'
      - 'web-app/src/containers/LuNativeModelPicker.tsx'
      - 'src-tauri/src/core/lu_inference.rs'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/plugins/tauri-plugin-agent-tools/Cargo.toml'
      - 'src-tauri/src/core/lu.rs'
      - 'docs/lu/jan-origin-inventory.json'
  pull_request:
    branches:
      - work/lu-json-audit-20261028
      - work/lu-phase3-ci-cleanup-20261028
    paths:
      - '.github/workflows/lu-native-webview2-e2e.yml'
      - 'scripts/stage-lu-webview2-sealed-engine.ps1'
      - 'e2e/specs/lu-native-inference.e2e.ts'
      - 'src-tauri/src/core/lu_inference.rs'
      - 'src-tauri/src/core/lu.rs'
      - 'web-app/src/lib/luInference.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lu-native-gui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-webview2:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      LU_E2E: '1'
      LU_E2E_NATIVE_INFERENCE: '1'
      # DX branch tests the real scoped host trace while preserving W02/W04;
      # W01 assistant-render acceptance remains an independent gate.
      LU_E2E_DX_SCOPED_ONLY: ${{ github.ref == 'refs/heads/work/lu-alpha01-diagnostics-priority-20261029' && '1' || '0' }}
      CARGO_INCREMENTAL: '0'
      TAURI_WEBDRIVER_PORT: '4549'
      JAN_E2E_HOME: ${{ github.workspace }}/.lu-native-gui-isolated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install and build Lu desktop frontend prerequisites
        shell: pwsh
        run: |
          corepack enable
          yarn install --immutable
          yarn build:icon
          node scripts/stub-tauri-resources.mjs
          yarn build:tauri:plugin:api
          yarn build:core
          yarn build:extensions
          node scripts/prepare-lu-distribution.mjs
          $env:IS_TAURI = 'true'
          $env:LU_BRAND = 'true'
          yarn build:web
          if ($LASTEXITCODE -ne 0) { throw 'Lu GUI frontend build failed' }

      - name: Verify W01 saved-turn persistence barrier
        shell: pwsh
        run: yarn vitest run --project @janhq/web-app web-app/src/hooks/__tests__/useMessages.test.ts

      - name: Compile and checksum seal pinned Lu CPU engine
        shell: pwsh
        run: |
          ./scripts/package-lu-inference-engine.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native Lu inference package build failed' }

      - name: Download checksum-pinned GGUF into isolated Lu profile only
        shell: pwsh
        run: |
          $target = Join-Path $env:JAN_E2E_HOME 'AppData/Roaming/Lu/data/lu-models'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $model = Join-Path $target 'qwen2.5-0.5b-instruct-q4_k_m.gguf'
          & curl.exe --fail --location --retry 2 --max-time 300 --output $model 'https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf'
          if ($LASTEXITCODE -ne 0) { throw 'Checksum-pinned Lu test model download failed' }
          $hash = (Get-FileHash -LiteralPath $model -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -cne '74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db') {
            throw 'Lu native E2E GGUF checksum mismatch'
          }

      - name: Compile test-only Lu WebView2 desktop with embedded driver
        shell: pwsh
        run: |
          $env:TAURI_CONFIG = Get-Content 'src-tauri/tauri.lu.conf.json' -Raw
          cargo build --locked --manifest-path src-tauri/Cargo.toml --features e2e,lu-distribution --bin Lu-Desktop
          if ($LASTEXITCODE -ne 0) { throw 'Lu native inference E2E host build failed' }
          if (!(Test-Path 'src-tauri/target/debug/Lu-Desktop.exe')) { throw 'Missing Lu E2E desktop binary' }
          # Debug Tauri searches two resource locations. Copy the exact
          # sealed file set, not a directory into an existing directory;
          # otherwise PowerShell can create an unmanifested nested package.
          ./scripts/stage-lu-webview2-sealed-engine.ps1 `
            -ExpectedManifestSha256 $env:LU_TRUSTED_LLAMA_PACKAGE_SHA256 `
            -ExpectedEngineSha256 $env:LU_TRUSTED_LLAMA_SERVER_SHA256

      - name: Typecheck isolated real WebView2 UI test
        shell: pwsh
        working-directory: e2e
        run: |
          yarn install --immutable
          yarn typecheck

      - name: Run real WebView2 GGUF conversation and native Protobuf tool-turn acceptance
        shell: pwsh
        working-directory: e2e
        run: |
          yarn test
          if ($LASTEXITCODE -ne 0) { throw 'Native Lu WebView2 GGUF acceptance failed' }

      - name: Preserve disposable test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lu-Native-Inference-WebView2-Diagnostics
          path: |
            e2e/logs/
          if-no-files-found: warn
          retention-days: 7
