name: Lu Windows installed NSIS GUI real GGUF native tool + restart
# The pinned historical NSIS lacks the Lu Core ULID conversation fix.
# Do not launch an expensive stale installed-GUI test on every source-only edit.
# Update/verify the pinned NSIS identity before dispatching this release gate.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: lu-installed-nsis-gui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installed-gui:
    runs-on: windows-2025
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit-test actual installed GUI gate locally authored assertions
        shell: pwsh
        run: |
          node --test scripts/lu/verify-installed-lu-gui-tool.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'GUI gate local invariants failed' }
      - name: Test native-only installed GUI evidence contract independently
        shell: pwsh
        run: |
          node --test scripts/lu/verify-installed-lu-uia-evidence.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'UIA native evidence validator failed' }
      - name: Download exactly pinned native-only Windows x64 Lu NSIS
        uses: actions/download-artifact@v4
        with:
          name: Lu-Windows-x64-NativeOnly-CPU-Installer
          repository: ${{ github.repository }}
          run-id: 41235830176
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/lu-pinned-native-only-nsis
      - name: Probe installed Windows GUI accessibility before fetching GGUF
        shell: pwsh
        run: |
          ./scripts/lu/run-installed-lu-gui-tool.ps1 `
            -ArtifactDir (Join-Path $env:RUNNER_TEMP 'lu-pinned-native-only-nsis') `
            -ProbeOnly
      - name: Cache checksum-pinned real GGUF between disposable verification runs
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/qwen2.5-0.5b-instruct-q4_k_m.gguf
          key: lu-gui-gguf-74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db
      - name: Download immutable real Qwen GGUF to disposable runner
        shell: pwsh
        run: |
          $model = Join-Path $env:RUNNER_TEMP 'qwen2.5-0.5b-instruct-q4_k_m.gguf'
          $hash = '74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db'
          if (!(Test-Path -LiteralPath $model -PathType Leaf)) {
            & curl.exe --fail --location --retry 2 --max-time 300 --output $model 'https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf'
            if ($LASTEXITCODE -ne 0) { throw 'Pinned real GGUF download failed' }
          }
          if ((Get-FileHash -LiteralPath $model -Algorithm SHA256).Hash.ToLowerInvariant() -cne $hash) {
            throw 'Pinned real GGUF checksum mismatch (including cached data)'
          }
      - name: Save hash-pinned GGUF for future independent verification runs
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/qwen2.5-0.5b-instruct-q4_k_m.gguf
          key: lu-gui-gguf-74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db
      - name: Run exact installed NSIS Lu GUI via UI Automation with real GGUF and journal
        shell: pwsh
        run: |
          ./scripts/lu/run-installed-lu-gui-tool.ps1 `
            -ArtifactDir (Join-Path $env:RUNNER_TEMP 'lu-pinned-native-only-nsis') `
            -ModelPath (Join-Path $env:RUNNER_TEMP 'qwen2.5-0.5b-instruct-q4_k_m.gguf')
          if ($LASTEXITCODE -ne 0) { throw 'Actual installed GUI gate failed' }
      # The test intentionally does not upload personal or disposable profiles,
      # real model output, raw CDP messages, SQLite data, or GGUF contents.
