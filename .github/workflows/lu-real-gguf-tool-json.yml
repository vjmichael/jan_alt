name: Lu real GGUF native tool JSON acceptance

on:
  push:
    branches:
      - 'lu/alpha-json-boundary-repair'
    paths:
      - 'src-tauri/lu-core/**'
      - '.github/workflows/lu-real-gguf-tool-json.yml'
  pull_request:
    paths:
      - 'src-tauri/lu-core/tests/real_gguf_tool_json.rs'
      - '.github/workflows/lu-real-gguf-tool-json.yml'
  workflow_dispatch:

permissions:
  contents: read

# A push to this review branch should not leave multiple full llama.cpp
# source builds racing for the same GGUF validation milestone.
concurrency:
  group: lu-real-gguf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-gguf-native-tool-json:
    name: Real GGUF generated JSON to Lu Protobuf tool
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/lu-core
      - name: Validate and compile real GGUF acceptance test before expensive downloads
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/lu-core/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { throw 'Real GGUF acceptance test formatting failed' }
          cargo test --manifest-path src-tauri/lu-core/Cargo.toml --test real_gguf_tool_json --no-run
          if ($LASTEXITCODE -ne 0) { throw 'Real GGUF test could not compile' }
      - name: Compile trusted pinned llama.cpp CPU engine
        shell: pwsh
        run: |
          ./scripts/package-lu-inference-engine.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Trusted Lu inference package build failed' }
          if (-not $env:LU_TRUSTED_LLAMA_SERVER_SHA256) {
            throw 'Missing pinned llama-server SHA-256 after build'
          }
      # Qwen2.5-0.5B-Instruct is a stronger structured-JSON model than the
      # 135M engine-only smoke fixture. Hash from the official Qwen GGUF file.
      - name: Download independently checksum-pinned tool-capable GGUF
        shell: pwsh
        run: |
          $model = Join-Path $env:RUNNER_TEMP 'qwen2.5-0.5b-instruct-q4_k_m.gguf'
          $url = 'https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf'
          & curl.exe --fail --location --retry 2 --max-time 300 --output $model $url
          if ($LASTEXITCODE -ne 0) { throw 'Unable to retrieve real GGUF model' }
          $expected = '74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db'
          $actual = (Get-FileHash -LiteralPath $model -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) { throw 'Real GGUF source checksum mismatch' }
          "LU_REAL_GGUF_PATH=$model" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LU_REAL_GGUF_SHA256=$expected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'Verified real GGUF downloaded; no synthetic model is permitted.'
      - name: Set disposable trusted test engine identity
        shell: pwsh
        run: |
          $server = (Resolve-Path 'src-tauri/resources/lu-inference/llama-server.exe').Path
          $expected = $env:LU_TRUSTED_LLAMA_SERVER_SHA256
          $actual = (Get-FileHash -LiteralPath $server -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) { throw 'Real llama-server engine hash mismatch' }
          $random = New-Object byte[] 32
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          try { $rng.GetBytes($random) } finally { $rng.Dispose() }
          $apiKey = [Convert]::ToHexString($random).ToLowerInvariant()
          "LU_REAL_LLAMA_SERVER_PATH=$server" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LU_REAL_LLAMA_SERVER_SHA256=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LU_REAL_LLAMA_API_KEY=$apiKey" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'Pinned engine identity verified; ephemeral API secret stored in runner environment.'
      - name: Run real GGUF model-generated JSON to native Protobuf tool
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/lu-core/Cargo.toml --test real_gguf_tool_json -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) {
            throw 'REAL GGUF native tool JSON acceptance did NOT pass; do not report model-generated tool use as verified'
          }
