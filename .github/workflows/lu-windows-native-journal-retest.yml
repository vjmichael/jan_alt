name: Lu native-only real GGUF durable journal and receipt regression
on:
  push:
    branches:
      - 'work/lu-win-native-only-journal-evidence-repair-20261031'
    paths:
      - '.github/workflows/lu-windows-native-journal-retest.yml'
      - 'src-tauri/lu-core/tests/real_gguf_tool_json.rs'
      - 'scripts/lu/check-installed-smoke-verdict.mjs'
      - 'scripts/lu/check-installed-smoke-verdict.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  actual-installed-NSIS-native-tool-retest:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify native tool receipt cannot self-certify alpha
        shell: pwsh
        run: |
          node --test scripts/lu/check-installed-smoke-verdict.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Lu provisional verdict guard failed' }
      - name: Download exact prior native-only installed Windows NSIS
        uses: actions/download-artifact@v4
        with:
          name: Lu-Windows-x64-NativeOnly-CPU-Installer
          repository: ${{ github.repository }}
          run-id: 41235830176
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/lu-pinned-nsis
      - name: Verify immutable installer revision and SHA-256
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'lu-pinned-nsis'
          $meta = Get-Content (Join-Path $folder 'lu-windows-x64-build.json') -Raw | ConvertFrom-Json
          if ($meta.gitCommit -cne '7fae3e19c42bf58d2223a4ea675690438a821e74' -or
              $meta.installerSha256 -cne '35acb87b602ed2a5313c70e8cadf79b77965dc6b91993c6820bcbfc64b6f9be3' -or
              $meta.distributionMode -cne 'native-only' -or $meta.legacyRuntimeBundled -ne $false) {
            throw 'Downloaded NSIS is not exact previously built native-only candidate'
          }
          $file = @(Get-ChildItem $folder -Recurse -File -Filter '*.exe')
          if ($file.Count -ne 1 -or $file[0].Name -cne $meta.installerFile -or
              (Get-FileHash $file[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $meta.installerSha256) {
            throw 'Native-only installer SHA verification failed'
          }
          Write-Host 'LU_INSTALLED_REUSE_PROVENANCE_PASS rebuild=false exact_SHA=true'
      - name: Download and SHA-pin actual Qwen GGUF
        shell: pwsh
        run: |
          $model = Join-Path $env:RUNNER_TEMP 'qwen2.5-0.5b-instruct-q4_k_m.gguf'
          $url = 'https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf'
          & curl.exe --fail --location --retry 2 --max-time 300 --output $model $url
          if ($LASTEXITCODE -ne 0) { throw 'Real model download failure' }
          $hash = '74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db'
          if ((Get-FileHash $model -Algorithm SHA256).Hash.ToLowerInvariant() -cne $hash) { throw 'Real GGUF SHA changed' }
          "LU_REAL_GGUF_SMOKE_MODEL=$model" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LU_REAL_GGUF_SMOKE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Retest installed package with actual Lu-native model/tool/journal
        shell: pwsh
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP 'lu-pinned-nsis'
          ./scripts/smoke-lu-windows-x64.ps1 -ArtifactDir $artifact -ExpectedCommit '7fae3e19c42bf58d2223a4ea675690438a821e74' -RequireNoLegacyPayload -ProbeStartup -ProbeInstalledNativeToolTurn -ProbeProfileRestart -RealGgufPath $env:LU_REAL_GGUF_SMOKE_MODEL -RealGgufSha256 $env:LU_REAL_GGUF_SMOKE_SHA256
      - name: Upload provisional result receipt for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lu-native-only-journal-retest-receipts
          path: |
            lu-installed-smoke-verdict.json
            lu-alpha-boundary-audit.json
          if-no-files-found: warn
