name: Lu Windows native filesystem security regression

on:
  push:
    branches:
      - lu/windows-native-tool-gate
    paths:
      - 'src-tauri/lu-core/src/native_files.rs'
      - 'src-tauri/lu-core/tests/model_native_files.rs'
      - '.github/workflows/lu-windows-native-files-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-security:
    name: Windows x64 native Protobuf file-tool isolation
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Run real Rust Protobuf native-file security tests
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/lu-core/Cargo.toml --test model_native_files -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Native-file isolation gate failed' }
