name: Lu Core Contracts
on:
  pull_request:
    paths:
      - 'src-tauri/lu-core/**'
      - 'src-tauri/plugins/tauri-plugin-agent-tools/**'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - '.github/workflows/lu-core-ci.yml'
  # Pull requests already run these contracts. A push on every lu/*
  # development branch duplicates PR costs; reserve push-only validation
  # for an explicit pre-merge staging ref when needed.
  push:
    branches:
      - 'lu/core-explicit-validation'
    paths:
      - 'src-tauri/lu-core/**'
      - 'src-tauri/plugins/tauri-plugin-agent-tools/**'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - '.github/workflows/lu-core-ci.yml'
  workflow_dispatch:

# Cancel stale runs as this branch receives additional development commits.
concurrency:
  group: lu-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/lu-core
      - name: Validate Jan's locked optional Lu foundation dependency graph
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --features lu-foundation --format-version 1 > /dev/null
      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/lu-core/Cargo.toml -- --check
      - name: Test core contracts
        run: cargo test --manifest-path src-tauri/lu-core/Cargo.toml --all-targets
      - name: Lint core contracts
        run: cargo clippy --manifest-path src-tauri/lu-core/Cargo.toml --all-targets -- -D warnings

  legacy-bridge:
    name: Jan native bridge (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/plugins/tauri-plugin-agent-tools
      - name: Check new Lu worker sources formatting
        run: |
          rustfmt --edition 2021 --check src-tauri/plugins/tauri-plugin-agent-tools/src/tools/ce_worker.rs src-tauri/plugins/tauri-plugin-agent-tools/tests/ce_worker_spawn.rs src-tauri/plugins/tauri-plugin-agent-tools/src/tools/ce_signed_runtime.rs src-tauri/plugins/tauri-plugin-agent-tools/tests/ce_signed_runtime.rs
          rustfmt --edition 2021 --check src-tauri/plugins/tauri-plugin-agent-tools/src/tools/ce_sealed_image.rs
      - name: Test headless native bridge and CE worker
        run: |
          cargo check --manifest-path src-tauri/plugins/tauri-plugin-agent-tools/Cargo.toml --no-default-features --features lu-bridge
          cargo test --manifest-path src-tauri/plugins/tauri-plugin-agent-tools/Cargo.toml --no-default-features --features lu-bridge 'lu_bridge::tests::'
          cargo test --manifest-path src-tauri/plugins/tauri-plugin-agent-tools/Cargo.toml --no-default-features --features lu-bridge 'tools::appcontainer::tests::strict_ce_helper_rejects_network_and_scratch_escalation'
          cargo test --manifest-path src-tauri/plugins/tauri-plugin-agent-tools/Cargo.toml --no-default-features --features lu-bridge --lib 'tools::ce_sealed_image::tests::'
          cargo test --manifest-path src-tauri/plugins/tauri-plugin-agent-tools/Cargo.toml --no-default-features --features lu-bridge --lib 'tools::jail::tests::signed_ce_bwrap_mounts_only_the_inherited_sealed_fd'
          cargo test --manifest-path src-tauri/plugins/tauri-plugin-agent-tools/Cargo.toml --no-default-features --features lu-bridge --test ce_worker_spawn
          cargo test --manifest-path src-tauri/plugins/tauri-plugin-agent-tools/Cargo.toml --no-default-features --features lu-bridge --test ce_signed_runtime

  signed-ce-linux:
    name: Lu signed CE real OS confinement (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/plugins/tauri-plugin-agent-tools
      - name: Install Linux bubblewrap test dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
      - name: Enable unprivileged user namespaces on ephemeral CI runner
        run: |
          # Ubuntu 24.04 AppArmor can prohibit bubblewrap user namespaces.
          # This changes only this disposable CI runner, never a Lu user's OS.
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Require actual signed worker launch, broker I/O and revocation
        env:
          LU_CE_REQUIRE_SANDBOX: "1"
        run: cargo test --manifest-path src-tauri/plugins/tauri-plugin-agent-tools/Cargo.toml --no-default-features --features lu-bridge --test ce_signed_runtime -- --nocapture

  ce-worker-windows:
    name: Lu CE worker OS isolation (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/plugins/tauri-plugin-agent-tools
      - name: Verify AppContainer deny and descendant termination
        run: cargo test --manifest-path src-tauri/plugins/tauri-plugin-agent-tools/Cargo.toml --no-default-features --features lu-bridge --test ce_worker_spawn
