name: Lu Core Contracts
on:
  pull_request:
    paths:
      - 'src-tauri/lu-core/**'
      - 'src-tauri/plugins/tauri-plugin-agent-tools/**'
      - '.github/workflows/lu-core-ci.yml'
  push:
    branches:
      - 'lu/**'
    paths:
      - 'src-tauri/lu-core/**'
      - 'src-tauri/plugins/tauri-plugin-agent-tools/**'
      - '.github/workflows/lu-core-ci.yml'
  workflow_dispatch:

# Cancel stale runs as this branch receives additional development commits.
concurrency:
  group: lu-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/lu-core
      - name: Format Lu core and synchronize Jan lockfile
        run: |
          cargo fmt --manifest-path src-tauri/lu-core/Cargo.toml
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null
          if [ "${{ github.event_name }}" = "push" ] && [[ "$GITHUB_REF" == refs/heads/lu/* ]]; then
            if ! git diff --quiet -- src-tauri/lu-core src-tauri/Cargo.lock; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add src-tauri/lu-core src-tauri/Cargo.lock
              git commit -m "chore(lu): rustfmt native filesystem and sync parent Cargo.lock"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi
      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/lu-core/Cargo.toml -- --check
      - name: Test core contracts
        run: cargo test --manifest-path src-tauri/lu-core/Cargo.toml --all-targets
      - name: Lint core contracts
        run: cargo clippy --manifest-path src-tauri/lu-core/Cargo.toml --all-targets -- -D warnings

  legacy-bridge:
    name: Jan native bridge (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/plugins/tauri-plugin-agent-tools
      - name: Test headless native bridge only
        run: |
          cargo check --manifest-path src-tauri/plugins/tauri-plugin-agent-tools/Cargo.toml --no-default-features --features lu-bridge
          cargo test --manifest-path src-tauri/plugins/tauri-plugin-agent-tools/Cargo.toml --no-default-features --features lu-bridge 'lu_bridge::tests::'
