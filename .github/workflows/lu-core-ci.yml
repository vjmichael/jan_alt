name: Lu Core Contracts
on:
  pull_request:
    paths:
      - 'src-tauri/lu-core/**'
      - 'src-tauri/plugins/tauri-plugin-agent-tools/**'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - '.github/workflows/lu-core-ci.yml'
  push:
    branches:
      - 'lu/**'
    paths:
      - 'src-tauri/lu-core/**'
      - 'src-tauri/plugins/tauri-plugin-agent-tools/**'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - '.github/workflows/lu-core-ci.yml'
  workflow_dispatch:

# Cancel stale runs as this branch receives additional development commits.
concurrency:
  group: lu-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/lu-core
      - name: Validate Jan's locked optional Lu foundation dependency graph
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --features lu-foundation --format-version 1 > /dev/null
      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/lu-core/Cargo.toml -- --check
      - name: Test core contracts
        run: cargo test --manifest-path src-tauri/lu-core/Cargo.toml --all-targets
      - name: Lint core contracts
        run: cargo clippy --manifest-path src-tauri/lu-core/Cargo.toml --all-targets -- -D warnings

  legacy-bridge:
    name: Jan native bridge (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/plugins/tauri-plugin-agent-tools
      - name: Check new Lu worker sources formatting
        run: |
          rustfmt --edition 2021 --check src-tauri/plugins/tauri-plugin-agent-tools/src/tools/ce_worker.rs src-tauri/plugins/tauri-plugin-agent-tools/tests/ce_worker_spawn.rs
      - name: Test headless native bridge and CE worker
        run: |
          cargo check --manifest-path src-tauri/plugins/tauri-plugin-agent-tools/Cargo.toml --no-default-features --features lu-bridge
          cargo test --manifest-path src-tauri/plugins/tauri-plugin-agent-tools/Cargo.toml --no-default-features --features lu-bridge 'lu_bridge::tests::'
          cargo test --manifest-path src-tauri/plugins/tauri-plugin-agent-tools/Cargo.toml --no-default-features --features lu-bridge 'tools::appcontainer::tests::strict_ce_helper_rejects_network_and_scratch_escalation'
          cargo test --manifest-path src-tauri/plugins/tauri-plugin-agent-tools/Cargo.toml --no-default-features --features lu-bridge --test ce_worker_spawn

  ce-worker-windows:
    name: Lu CE worker OS isolation (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/plugins/tauri-plugin-agent-tools
      - name: Verify AppContainer deny and descendant termination
        run: cargo test --manifest-path src-tauri/plugins/tauri-plugin-agent-tools/Cargo.toml --no-default-features --features lu-bridge --test ce_worker_spawn
