name: Lu Windows installed GUI cold-restoration source and syntax contract
on:
  push:
    branches:
      - 'lu/windows-alpha-six-gates-20261031'
    paths:
      - '.github/workflows/lu-windows-gui-cold-restore-contract.yml'
      - 'scripts/lu/run-installed-lu-uia-full.ps1'
      - 'scripts/lu/check-installed-gui-cold-restore.mjs'
      - 'scripts/lu/check-installed-gui-cold-restore.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gui-restore-source:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check offline GUI restoration mutation tests and installed script contract
        shell: pwsh
        run: |
          node --test scripts/lu/check-installed-gui-cold-restore.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'GUI cold render regression failed' }
          node scripts/lu/check-installed-gui-cold-restore.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed GUI cold-render source contract failed' }
      - name: Parse genuine Windows UI Automation script without executing tools
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/lu/run-installed-lu-uia-full.ps1').ProviderPath,
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw 'Windows PowerShell syntax rejected restored GUI harness' }
          Write-Host 'LU_WIN6_COLD_GUI_READBACK_SOURCE_PASS installed_test=required'
