name: Lu Windows x64 packaged inference worker loopback smoke

on:
  push:
    branches:
      - lu/windows-x64-engine-worker-smoke
    paths:
      - '.github/workflows/lu-windows-engine-worker-smoke.yml'
      - 'scripts/check-lu-windows-engine-worker.ps1'
      - 'scripts/smoke-lu-windows-x64.ps1'

permissions:
  contents: read
  actions: read

concurrency:
  group: lu-windows-engine-worker-${{ github.ref }}
  cancel-in-progress: true

# Uses an already compiled Windows x64 Lu installer. No expensive build
# retry and no model downloads. Only 127.0.0.1 is contacted by the probe.
jobs:
  packaged-worker:
    name: Installed x64 llama.cpp worker boot, auth and shutdown
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download existing validated x64 Lu NSIS artifact
        uses: actions/download-artifact@v4
        with:
          name: Lu-Windows-x64-Vulkan-Development-Installer
          repository: ${{ github.repository }}
          run-id: 40542686980
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/lu-windows-artifact

      - name: Verify installer, run authenticated packaged llama.cpp worker and remove Lu
        shell: pwsh
        run: |
          ./scripts/smoke-lu-windows-x64.ps1 `
            -ArtifactDir "$env:RUNNER_TEMP/lu-windows-artifact" `
            -ExpectedCommit 'd6edb050d797e0d492223db6da8f335dd7c37ce1' `
            -ProbeWorker
