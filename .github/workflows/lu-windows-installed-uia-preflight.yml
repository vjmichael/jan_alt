name: Lu native-only installed GUI Windows UIA preflight
on:
  push:
    branches:
      - lu/windows-alpha-security-staging-20261031
    paths:
      - scripts/lu/probe-installed-lu-uia.ps1
      - .github/workflows/lu-windows-installed-uia-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  actual-installed-UIA:
    name: Installed unchanged NSIS Lu desktop UI Automation window gate
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download exact native-only Lu NSIS from prior verified build
        uses: actions/download-artifact@v4
        with:
          name: Lu-Windows-x64-NativeOnly-CPU-Installer
          repository: ${{ github.repository }}
          run-id: 41235830176
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/lu-pinned-native-only-nsis
      - name: Install immutable Lu and inspect genuine Windows accessibility controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:RUNNER_TEMP 'lu-pinned-native-only-nsis'
          $meta = Get-Content -LiteralPath (Join-Path $source 'lu-windows-x64-build.json') -Raw | ConvertFrom-Json
          $sha = '35acb87b602ed2a5313c70e8cadf79b77965dc6b91993c6820bcbfc64b6f9be3'
          if ($meta.gitCommit -cne '7fae3e19c42bf58d2223a4ea675690438a821e74' -or
              $meta.installerSha256 -cne $sha -or $meta.distributionMode -cne 'native-only' -or
              $meta.legacyRuntimeBundled -ne $false) { throw 'Unpinned NSIS identity.' }
          $exe = @(Get-ChildItem -LiteralPath $source -Recurse -File -Filter '*.exe')
          if ($exe.Count -ne 1 -or $exe[0].Name -cne $meta.installerFile -or
              (Get-FileHash -LiteralPath $exe[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $sha) {
            throw 'Native-only NSIS checksum mismatch.'
          }
          $install = Join-Path $env:RUNNER_TEMP ('lu-installed-uia-' + [guid]::NewGuid().ToString('N'))
          $profile = Join-Path $env:RUNNER_TEMP ('lu-uia-profile-' + [guid]::NewGuid().ToString('N'))
          $installed = $false
          try {
            $p = Start-Process -FilePath $exe[0].FullName -ArgumentList ('/S /D=' + $install) -PassThru -Wait -NoNewWindow
            if ($p.ExitCode -ne 0) { throw 'NSIS install failed.' }
            $installed = $true
            $app = Join-Path $install 'Lu-Desktop.exe'
            if (!(Test-Path -LiteralPath $app -PathType Leaf)) { throw 'Installed Lu Desktop missing.' }
            $legacy = @(Get-ChildItem -LiteralPath $install -File -Recurse | Where-Object { $_.Name -in @('jan-llama-worker.exe','bun.exe','uv.exe') })
            if ($legacy.Count -ne 0) { throw 'Legacy executable in native-only package.' }
            # Use Windows PowerShell STA and built-in UI Automation APIs; no
            # test-only binary, injected JS, CDP, extra packages, or Lu IPC.
            & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -Sta -ExecutionPolicy Bypass `
              -File 'scripts/lu/probe-installed-lu-uia.ps1' -InstalledApp $app -ProfileRoot $profile
            if ($LASTEXITCODE -ne 0) { throw 'Installed real Lu UIA preflight failed.' }
          } finally {
            if ($installed) {
              $uninstall = @(Get-ChildItem -LiteralPath $install -File -Filter 'uninstall*.exe')
              if ($uninstall.Count -eq 1) {
                $p = Start-Process -FilePath $uninstall[0].FullName -ArgumentList '/S' -Wait -PassThru -NoNewWindow
                if ($p.ExitCode -ne 0) { throw 'Disposable Lu uninstall failed.' }
              }
            }
          }
