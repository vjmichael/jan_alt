name: Lu DX-15E Windows native assistant cold-restart acceptance

on:
  push:
    branches:
      - lu/dx-native-assistant-cold-restart-20261029
      - lu/alpha-native-first-chat-20261030
      - lu/dx-native-failure-class-20261030
      - lu/alpha-native-plain-final-20261030
      - lu/alpha-native-plain-final-format-20261030
      - lu/windows-alpha-resume-20261031
    paths:
      - '.github/workflows/lu-dx-native-assistant-restart-windows.yml'
      - 'e2e/specs/lu-native-assistant-restart.e2e.ts'
      - 'e2e/wdio.conf.ts'
      - 'web-app/src/lib/luAssistantDeliveryEvidence.ts'
      - 'web-app/src/lib/luInference.ts'
      - 'web-app/src/lib/luDiagnostics.ts'
      - 'src-tauri/lu-core/src/supervised_tool_generation.rs'
      - 'src-tauri/lu-core/src/agent_tool_loop.rs'
      - 'src-tauri/lu-core/tests/native_agent_tool_turn.rs'
      - 'src-tauri/src/core/lu_inference.rs'
      - 'src-tauri/src/core/lu_recovery.rs'
      - 'src-tauri/src/lib.rs'
      - 'extensions/llamacpp-extension/src/index.ts'
      - 'extensions/llamacpp-extension/src/test/index.test.ts'
      - 'web-app/src/routes/threads/**'
      - 'web-app/src/routes/index.tsx'
      - 'web-app/src/containers/LuNativeNewChat.tsx'
      - 'web-app/src/containers/MessageItem.tsx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lu-dx-native-restart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-webview2:
    runs-on: windows-2025
    timeout-minutes: 110
    env:
      LU_E2E: '1'
      LU_E2E_NATIVE_INFERENCE: '1'
      # DX branch tests the real scoped host trace while preserving W02/W04;
      # W01 assistant-render acceptance remains an independent gate.
      LU_E2E_DX_SCOPED_ONLY: ${{ github.ref == 'refs/heads/work/lu-alpha01-diagnostics-priority-20261029' && '1' || '0' }}
      # Independent GUI/report gate: no successful model/tool turn is assumed.
      LU_E2E_DX_EXPORT_ONLY: ${{ github.ref == 'refs/heads/lu/dx-export-webview2-acceptance-20261029' && '1' || '0' }}
      # DX-05 runs a real GGUF turn and checks the host-only finding in the
      # operator export; independent of assistant persistence/render success.
      LU_E2E_DX_HOST_FINDING_ONLY: ${{ github.ref == 'refs/heads/lu/dx-webview2-host-finding-acceptance-20261029' && '1' || '0' }}
      # DX-06 preserves DX-05 and checks the operator's safe, readable result.
      LU_E2E_DX_OPERATOR_ONLY: ${{ (github.ref == 'refs/heads/lu/dx-operator-health-panel-20261029' || github.ref == 'refs/heads/lu/dx-webview2-checkpoint-integrity-20261029' || github.ref == 'refs/heads/lu/dx-real-host-typed-witness-20261029') && '1' || '0' }}
      CARGO_INCREMENTAL: '0'
      TAURI_WEBDRIVER_PORT: '4551'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set disposable native Lu profile under Windows runner temp
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ("lu-dx-native-restart-" + $env:GITHUB_RUN_ID)
          "JAN_E2E_HOME=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install and build Lu desktop frontend prerequisites
        shell: pwsh
        run: |
          corepack enable
          yarn install --immutable
          yarn build:icon
          node scripts/stub-tauri-resources.mjs
          yarn build:tauri:plugin:api
          yarn build:core
          yarn build:extensions
          node scripts/prepare-lu-distribution.mjs
          $env:IS_TAURI = 'true'
          $env:LU_BRAND = 'true'
          yarn build:web
          if ($LASTEXITCODE -ne 0) { throw 'Lu GUI frontend build failed' }

      - name: Verify W01 saved-turn persistence barrier
        shell: pwsh
        run: |
          yarn vitest run --project @janhq/web-app web-app/src/hooks/__tests__/useMessages.test.ts web-app/src/lib/__tests__/luDiagnostics.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Saved-turn or diagnostic projection regression failed' }

      - name: Verify bounded native reply shape and display-only integer
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/lu-core/Cargo.toml --lib failure_class_tests
          if ($LASTEXITCODE -ne 0) { throw 'Lu reply-shape diagnostics failed' }
          cargo test --manifest-path src-tauri/lu-core/Cargo.toml --test native_agent_tool_turn lu_integer_chat_reply_is_display_only_without_json_tool_relaxation -- --exact
          if ($LASTEXITCODE -ne 0) { throw 'Lu display-only integer boundary failed' }

      - name: Verify Lu brand blocks inherited Jan inference startup
        shell: pwsh
        run: |
          yarn workspace @janhq/llamacpp-extension test:run -t 'keeps the legacy Jan worker and embedder dormant in a Lu distribution'
          if ($LASTEXITCODE -ne 0) { throw 'Lu native distribution started a legacy Jan worker or embedder' }

      - name: Compile and checksum seal pinned Lu CPU engine
        shell: pwsh
        run: |
          ./scripts/package-lu-inference-engine.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native Lu inference package build failed' }

      - name: Download checksum-pinned GGUF into isolated Lu profile only
        shell: pwsh
        run: |
          $target = Join-Path $env:JAN_E2E_HOME 'AppData/Roaming/Lu/data/lu-models'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $model = Join-Path $target 'qwen2.5-0.5b-instruct-q4_k_m.gguf'
          & curl.exe --fail --location --retry 2 --max-time 300 --output $model 'https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf'
          if ($LASTEXITCODE -ne 0) { throw 'Checksum-pinned Lu test model download failed' }
          $hash = (Get-FileHash -LiteralPath $model -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -cne '74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db') {
            throw 'Lu native E2E GGUF checksum mismatch'
          }

      - name: Compile test-only Lu WebView2 desktop with embedded driver
        shell: pwsh
        run: |
          $env:TAURI_CONFIG = Get-Content 'src-tauri/tauri.lu.conf.json' -Raw
          cargo build --locked --manifest-path src-tauri/Cargo.toml --features e2e,lu-distribution --bin Lu-Desktop
          if ($LASTEXITCODE -ne 0) { throw 'Lu native inference E2E host build failed' }
          if (!(Test-Path 'src-tauri/target/debug/Lu-Desktop.exe')) { throw 'Missing Lu E2E desktop binary' }
          # Debug Tauri searches two resource locations. Copy the exact
          # sealed file set, not a directory into an existing directory;
          # otherwise PowerShell can create an unmanifested nested package.
          ./scripts/stage-lu-webview2-sealed-engine.ps1 `
            -ExpectedManifestSha256 $env:LU_TRUSTED_LLAMA_PACKAGE_SHA256 `
            -ExpectedEngineSha256 $env:LU_TRUSTED_LLAMA_SERVER_SHA256

      - name: Compile Windows native runtime restart regression
        shell: pwsh
        run: |
          # The app_lib unit-test executable currently fails at Windows loader
          # entrypoint resolution (0xC0000139), before its test harness starts.
          # Compile its test source here; the WebView2 exit -> process A restart
          # phases below exercise the real runtime behavior on Windows.
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features e2e,lu-distribution --lib --no-run
          if ($LASTEXITCODE -ne 0) { throw 'Windows Lu native recovery test source failed to compile' }

      - name: Typecheck isolated real WebView2 UI test
        shell: pwsh
        working-directory: e2e
        run: |
          yarn install --immutable
          yarn typecheck

      - name: Process X - load the Lu-owned engine and request desktop exit
        shell: pwsh
        working-directory: e2e
        env:
          LU_E2E_NATIVE_RESTART_PHASE: exit
        run: |
          # confirm_exit intentionally closes the embedded WebDriver server.
          # WDIO's deleteSession then reports ECONNREFUSED despite the test
          # reaching LU_NATIVE_EXIT_REQUESTED. Require that exact test witness;
          # the following step independently proves both PIDs have exited.
          $exitLog = Join-Path $env:RUNNER_TEMP 'lu-native-exit-wdio.txt'
          yarn test 2>&1 | Tee-Object -FilePath $exitLog
          $code = $LASTEXITCODE
          $witness = Join-Path $env:JAN_E2E_HOME 'lu-native-exit-checkpoint.json'
          if (!(Test-Path -LiteralPath $witness) -or
              !(Select-String -LiteralPath $exitLog -Pattern 'LU_NATIVE_EXIT_REQUESTED loaded_engine=true' -SimpleMatch -Quiet)) {
            throw "Native exit test did not reach the loaded-engine exit request (WDIO code $code)"
          }
          if ($code -ne 0) {
            Write-Host 'LU_NATIVE_EXIT_WDIO_DISCONNECTED awaiting independent process assertion'
          }

      - name: Require the Lu-owned engine child and desktop to have exited
        shell: pwsh
        run: |
          $witnessPath = Join-Path $env:JAN_E2E_HOME 'lu-native-exit-checkpoint.json'
          if (!(Test-Path -LiteralPath $witnessPath)) { throw 'No loaded-engine exit witness' }
          $witness = Get-Content -LiteralPath $witnessPath -Raw | ConvertFrom-Json
          $enginePid = [int]$witness.enginePid
          if ($enginePid -le 0) { throw 'Invalid Lu-owned engine PID witness' }
          $binary = (Resolve-Path 'src-tauri/target/debug/Lu-Desktop.exe').Path
          for ($attempt = 0; $attempt -lt 40; $attempt++) {
            $engine = Get-CimInstance Win32_Process -Filter "ProcessId = $enginePid" -ErrorAction SilentlyContinue
            $hostProcess = @(Get-CimInstance Win32_Process -Filter "Name = 'Lu-Desktop.exe'" |
              Where-Object { $_.ExecutablePath -ceq $binary })
            if (!$engine -and $hostProcess.Count -eq 0) { break }
            Start-Sleep -Milliseconds 250
          }
          if (Get-CimInstance Win32_Process -Filter "ProcessId = $enginePid" -ErrorAction SilentlyContinue) {
            throw 'Lu-owned model engine survived confirm_exit'
          }
          $staleHost = @(Get-CimInstance Win32_Process -Filter "Name = 'Lu-Desktop.exe'" |
            Where-Object { $_.ExecutablePath -ceq $binary })
          if ($staleHost.Count -gt 0) { throw 'Lu desktop survived confirm_exit' }
          Write-Host 'LU_NATIVE_EXIT_PASS loaded_engine_child_gone=true'

      - name: Process A - generate real Lu native GGUF assistant, attest readback, shutdown
        shell: pwsh
        working-directory: e2e
        env:
          LU_E2E_NATIVE_RESTART_PHASE: write
        run: |
          yarn test
          if ($LASTEXITCODE -ne 0) { throw 'DX-15E process A native GGUF write phase failed' }

      - name: Prove Lu and WebDriver were fully shut down
        shell: pwsh
        run: |
          $binary = (Resolve-Path 'src-tauri/target/debug/Lu-Desktop.exe').Path
          $stale = @(Get-CimInstance Win32_Process -Filter "Name = 'Lu-Desktop.exe'" |
            Where-Object { $_.ExecutablePath -ceq $binary })
          if ($stale.Count -gt 0) { throw 'Phase A Lu host process survived WDIO teardown' }
          if (Get-NetTCPConnection -LocalPort 4551 -State Listen -ErrorAction SilentlyContinue) {
            throw 'Phase A WebDriver listener survived shutdown'
          }
          $checkpoint = Join-Path $env:JAN_E2E_HOME 'lu-dx-native-restart-checkpoint.json'
          if (!(Test-Path -LiteralPath $checkpoint)) { throw 'Phase A produced no restart checkpoint' }

      - name: Process B - new native Lu host restores exact assistant from disk
        shell: pwsh
        working-directory: e2e
        env:
          LU_E2E_NATIVE_RESTART_PHASE: read
        run: |
          yarn test
          if ($LASTEXITCODE -ne 0) { throw 'DX-15E process B cold restart read phase failed' }

      - name: Prove two-process native assistant readback passed
        shell: pwsh
        run: Write-Host 'LU_DX15E_NATIVE_COLD_RESTART_PASS separate_lu_processes=true real_native_gguf=true'


      - name: Preserve disposable test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lu-DX15E-Native-Restart-WebView2-Logs
          path: |
            e2e/logs/
          # Never upload test profile, message JSONL, or generated assistant text.
          if-no-files-found: warn
          retention-days: 7
