name: Lu desktop native chat IPC boundary

on:
  push:
    branches:
      - work/lu-*
      - lu/**
    paths:
      - 'scripts/check-lu-native-chat-boundary*.mjs'
      - '.github/workflows/lu-native-chat-ipc-contract.yml'
      - 'src-tauri/src/core/lu_inference.rs'
      - 'src-tauri/src/core/lu.rs'
      - 'src-tauri/src/lib.rs'
      - 'web-app/src/lib/luInference.ts'
      - 'web-app/src/lib/__tests__/luInference.test.ts'
      - 'src-tauri/lu-core/src/saved_chat_prompt.rs'
      - 'src-tauri/lu-core/tests/saved_chat_prompt_limits.rs'
  pull_request:
    branches:
      - work/lu-native-chat-boundary-check
      - lu/desktop-saved-user-text-gate
    paths:
      - 'scripts/check-lu-native-chat-boundary*.mjs'
      - '.github/workflows/lu-native-chat-ipc-contract.yml'
      - 'src-tauri/src/core/lu_inference.rs'
      - 'src-tauri/src/core/lu.rs'
      - 'src-tauri/src/lib.rs'
      - 'web-app/src/lib/luInference.ts'
      - 'web-app/src/lib/__tests__/luInference.test.ts'
      - 'src-tauri/lu-core/src/saved_chat_prompt.rs'
      - 'src-tauri/lu-core/tests/saved_chat_prompt_limits.rs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipc-contract:
    name: Native chat IPC boundary (no Windows build)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove the boundary verifier rejects broken contracts
        run: node --test scripts/check-lu-native-chat-boundary.test.mjs
      - name: Check actual Lu native desktop source contract
        run: node scripts/check-lu-native-chat-boundary.mjs

  frontend-chat:
    name: Lu native chat frontend adapter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: yarn install --immutable
      - name: Build linked frontend dependencies
        run: |
          yarn build:tauri:plugin:api
          yarn build:core
          yarn build:extensions
      - name: Test Lu native chat adapter
        run: yarn workspace @janhq/web-app exec vitest run src/lib/__tests__/luInference.test.ts

  saved-prompt-contract:
    name: Saved chat prompt bounds (headless Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/lu-core
      - name: Test Lu saved conversation prompt limits
        run: cargo test --locked --manifest-path src-tauri/lu-core/Cargo.toml --test saved_chat_prompt_limits
